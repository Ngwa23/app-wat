spring:
  application:
    name: wat-website

  # Serve static assets efficiently; the response cache headers are tuned in WebConfig.
  web:
    resources:
      chain:
        cache: true

  # Embedded H2 database in FILE mode. Persists under ${WAT_DATA_DIR} so the
  # admin's content survives restarts and lives outside the packaged jar.
  datasource:
    url: jdbc:h2:file:${WAT_DATA_DIR:./data}/wat;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # Allow image, document and (larger) video uploads from the admin panel.
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 2MB

  # SMTP is optional. Configure these (preferably via environment variables) to
  # enable email delivery of contact / careers submissions. Left unset, the app
  # still runs and records every submission to the log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:9090}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,image/svg+xml,application/json
    min-response-size: 1024
  http2:
    enabled: true
  servlet:
    session:
      cookie:
        # SameSite=Lax means the admin session cookie is NOT sent on cross-site
        # POSTs, which blocks CSRF against the admin API without token plumbing.
        same-site: lax
        http-only: true
  error:
    whitelabel:
      enabled: true

wat:
  # Writable directory for the database, uploaded images and JSON backups.
  data-dir: ${WAT_DATA_DIR:./data}

  # Superadmin seeded on first run (only if no admin user exists yet).
  admin:
    username: ${WAT_ADMIN_USER:NGWA23}
    # BCrypt hash of the initial password — NEVER the plaintext. Rotate it from
    # the admin panel (Account tab) after first login.
    password-hash: "${WAT_ADMIN_PASSWORD_HASH:$2a$10$ijQyemqCFG6VPi8YQFoBDOS2j5RdOYCAIvvzJchaqSlMRPGgHOL3S}"

  mail:
    enabled: ${WAT_MAIL_ENABLED:false}
    to: ${WAT_MAIL_TO:worldadvancedtechnology23@gmail.com}
    from: ${WAT_MAIL_FROM:no-reply@worldadvancedtechnology.cm}

# Expose only a lightweight health endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is optional; don't let an unconfigured mail server mark the app DOWN.
    mail:
      enabled: false
