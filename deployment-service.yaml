apiVersion: apps/v1
kind: Deployment # Kubernetes resource kind we are creating
metadata:
  name: watapp
spec:
  selector:
    matchLabels:
      app: watapp
  replicas: 2 # Number of replicas that will be created for this deployment
  template:
    metadata:
      labels:
        app: watapp
    spec:
      containers:
      - name: watapp
        image: ngwa23/watapp:v1 # Image that will be used to containers in the cluster
        imagePullPolicy: Always
        ports:
        - containerPort: 7070 # The port that the container is running on in the cluster
---
apiVersion: v1
kind: Service
metadata:
  name: watapp-svc
spec:
  type: NodePort
  selector:
    app: watapp
  ports:
  - protocol: TCP
    port: 80
    targetPort: 7070
    nodePort: 30008 # Optional (default: 30000-32767)
