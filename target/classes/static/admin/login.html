<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>WAT Admin · Sign in</title>
  <style>
    :root{
      --bg:#0b1020; --card:#131a2e; --line:#243049; --txt:#e7ecf6; --muted:#9aa7c2;
      --gold:#d4af37; --gold2:#f2cf5b; --danger:#ef4444; --ok:#22c55e; --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--txt);background:
        radial-gradient(900px 500px at 15% -10%,rgba(212,175,55,.12),transparent 60%),
        radial-gradient(800px 500px at 110% 10%,rgba(59,130,246,.12),transparent 55%),
        var(--bg);padding:24px}
    .card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
      border:1px solid var(--line);border-radius:var(--radius);padding:34px 30px;
      box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;
      background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1407}
    h1{font-size:1.15rem;margin:0}
    .sub{color:var(--muted);font-size:.86rem;margin:2px 0 0}
    label{display:block;font-size:.8rem;color:var(--muted);margin:16px 0 6px}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
      background:#0e1526;color:var(--txt);font-size:.95rem;outline:none}
    input:focus{border-color:var(--gold)}
    button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;cursor:pointer;
      font-weight:700;font-size:.95rem;color:#1a1407;background:linear-gradient(135deg,var(--gold),var(--gold2))}
    button:hover{filter:brightness(1.05)}
    .msg{margin-top:16px;padding:10px 12px;border-radius:10px;font-size:.85rem;display:none}
    .msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca}
    .msg.ok{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#bbf7d0}
    .remember{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--muted);font-size:.82rem}
    .remember input{width:auto}
    .foot{margin-top:18px;text-align:center}
    .foot a{color:var(--muted);font-size:.82rem;text-decoration:none}
    .foot a:hover{color:var(--gold)}
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/login" autocomplete="off">
    <div class="brand">
      <div class="logo">W</div>
      <div><h1>WAT Admin</h1><p class="sub">Superadmin control panel</p></div>
    </div>
    <div id="errMsg" class="msg err">Invalid username or password.</div>
    <div id="okMsg" class="msg ok">You have been signed out.</div>

    <label for="username">Username</label>
    <input id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <label class="remember"><input type="checkbox" name="remember-me" value="true" checked> Keep me signed in on this device</label>

    <button type="submit">Sign in</button>

    <div class="foot"><a href="/">← Back to website</a></div>
  </form>
  <script>
    var q = new URLSearchParams(location.search);
    if (q.has("error")) document.getElementById("errMsg").style.display = "block";
    if (q.has("logout")) document.getElementById("okMsg").style.display = "block";
  </script>
</body>
</html>
