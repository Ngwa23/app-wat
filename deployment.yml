apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-wat
  labels:
    app: app-wat
    app.kubernetes.io/name: app-wat
    app.kubernetes.io/version: "3.0.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-wat
  template:
    metadata:
      labels:
        app: app-wat
        app.kubernetes.io/name: app-wat
        app.kubernetes.io/version: "3.0.1"
    spec:
      # Pod-level security: a numeric fsGroup makes the emptyDir /tmp group-owned
      # and writable by the non-root user below.
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-wat
          # Your Docker Hub image. CI (`kubectl set image`) overrides this with a
          # specific version tag (e.g. :v6) on each deploy; the :latest default
          # here is only used by a plain `kubectl apply`. imagePullPolicy: Always
          # makes nodes re-pull :latest instead of serving a stale cached layer.
          image: docker.io/ngwa23/watapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9090
          env:
            # Make the app listen on 9090 (matches Dockerfile EXPOSE / HEALTHCHECK).
            - name: PORT
              value: "9090"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
            # The root filesystem is read-only, so the H2 file DB, uploads and
            # JSON backups MUST live on a writable volume. Point the app's data
            # dir at the mounted "data" volume below; otherwise the pod cannot
            # create /app/data/wat.mv.db and CrashLoopBackOffs on startup.
            - name: WAT_DATA_DIR
              value: "/data"
          # Optional SMTP config. Create a Secret named "app-wat-mail" with keys
          # MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, WAT_MAIL_ENABLED, etc.
          # It is marked optional so the Deployment still runs if the Secret is absent.
          envFrom:
            - secretRef:
                name: app-wat-mail
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            # A NUMERIC uid/gid is required: with runAsNonRoot and only a named
            # USER in the image, the kubelet can't verify non-root and fails with
            # CreateContainerConfigError. 1001 matches the Dockerfile's USER.
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The root filesystem is read-only, so give the JVM / embedded Tomcat
          # writable scratch space. Without this the server cannot create its
          # work/temp dir and the pod CrashLoopBackOffs on startup.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Writable data dir for the H2 database, uploaded images and JSON
            # backups (WAT_DATA_DIR=/data above). emptyDir keeps the pod from
            # crashing on the read-only root; see the note below on persistence.
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        # NOTE: emptyDir is per-pod and ephemeral — admin content and uploads do
        # NOT survive a restart and are NOT shared across the 2 replicas. For
        # durable, shared data replace this with a ReadWriteMany PersistentVolume
        # (e.g. an NFS-backed PVC named "app-wat-data"):
        #   - name: data
        #     persistentVolumeClaim:
        #       claimName: app-wat-data
        - name: data
          emptyDir: {}
