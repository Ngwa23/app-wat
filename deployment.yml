apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-wat
  labels:
    app: app-wat
    app.kubernetes.io/name: app-wat
    app.kubernetes.io/version: "3.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-wat
  template:
    metadata:
      labels:
        app: app-wat
        app.kubernetes.io/name: app-wat
        app.kubernetes.io/version: "3.0.0"
    spec:
      containers:
        - name: app-wat
          # Replace with your registry/image:tag, e.g. ghcr.io/you/app-wat:3.0.0
          image: app-wat:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            # Make the app listen on 9090 (matches Dockerfile EXPOSE / HEALTHCHECK).
            - name: PORT
              value: "9090"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
          # Optional SMTP config. Create a Secret named "app-wat-mail" with keys
          # MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, WAT_MAIL_ENABLED, etc.
          # It is marked optional so the Deployment still runs if the Secret is absent.
          envFrom:
            - secretRef:
                name: app-wat-mail
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The root filesystem is read-only, so give the JVM / embedded Tomcat
          # writable scratch space. Without this the server cannot create its
          # work/temp dir and the pod CrashLoopBackOffs on startup.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
