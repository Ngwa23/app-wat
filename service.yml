# All three Service types for app-wat, defined separately.
# They all select the same pods (app: app-wat) but expose them differently.
# Apply all at once:  kubectl apply -f service.yml
# ---------------------------------------------------------------------------

# 1) ClusterIP — internal-only access (default). Reachable inside the cluster
#    at:  http://app-wat:80
apiVersion: v1
kind: Service
metadata:
  name: app-wat
  labels:
    app: app-wat
    service-type: clusterip
spec:
  type: ClusterIP
  selector:
    app: app-wat
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http   # container port 9090
---
# 2) NodePort — exposes the app on a static port on every node.
#    Reachable at:  http://<node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: app-wat-nodeport
  labels:
    app: app-wat
    service-type: nodeport
spec:
  type: NodePort
  selector:
    app: app-wat
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http   # container port 9090
      nodePort: 30080    # must be in the 30000-32767 range
---
# 3) LoadBalancer — provisions an external load balancer (cloud providers).
#    Reachable at the external IP assigned by the provider on port 80.
apiVersion: v1
kind: Service
metadata:
  name: app-wat-lb
  labels:
    app: app-wat
    service-type: loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: app-wat
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http   # container port 9090
