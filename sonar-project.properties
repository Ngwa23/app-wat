# SonarQube configuration for the standalone sonar-scanner CLI.
#
# NOTE: When you analyze via Maven (mvn sonar:sonar), SonarQube reads its
# settings from pom.xml and IGNORES this file. This file is only used if you
# run the standalone scanner instead:
#     sonar-scanner -Dsonar.token=YOUR_TOKEN
#
# Never store the authentication token here. Pass it at runtime via
# -Dsonar.token=... or the SONAR_TOKEN environment variable.

# --- Project identity (must match what appears in the SonarQube dashboard) ---
sonar.projectKey=com.worldadvancedtechnology:app-wat
sonar.projectName=WORLD ADVANCED TECHNOLOGY Website
sonar.projectVersion=3.0.0

# --- Server ---
sonar.host.url=http://localhost:9000

# --- Sources & tests ---
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# --- Java: tell the scanner where compiled classes and libraries live ---
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/*.jar

# --- Coverage: JaCoCo XML report produced by `mvn verify` ---
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Exclude generated / build output from analysis ---
sonar.exclusions=target/**,**/generated-sources/**
