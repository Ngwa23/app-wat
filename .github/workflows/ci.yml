# GitHub Actions CI/CD for app-wat (WORLD ADVANCED TECHNOLOGY website)
# Mirrors the Jenkinsfile, but runs on GitHub's hosted runners instead of a
# self-managed Jenkins server. Flow:
#   Build & Test  ->  Auto-version + Build & Push image to Docker Hub
# Each push to master bumps the version: v5 exists -> publishes v6 (+ latest).
# The deploy step is intentionally left as a commented template (see bottom).

name: CI/CD                       # Shown in the repo's "Actions" tab.

# ---- When does this pipeline run? ----
on:
  push:
    branches: [ master ]          # Run on every push to master (build + publish image).
  pull_request:
    branches: [ master ]          # Run on PRs too, but only build+test (no publish).

# The image goes to Docker Hub, but we DO write back one thing to GitHub:
# the new version tag (e.g. v6), so contents:write is required.
permissions:
  contents: write                 # Clone the repo AND push the new git tag.

# ---- Shared values, written once, reused below ----
env:
  REGISTRY: docker.io                         # Docker Hub (matches the Jenkinsfile).
  IMAGE_NAME: ngwa23/watapp                   # Your Docker Hub repo: <account>/<repo>.

jobs:
  # ===================================================================
  # JOB 1 — compile, run tests, and produce the jar as an artifact
  # ===================================================================
  build-and-test:
    runs-on: ubuntu-latest        # GitHub spins up a fresh Linux VM for free.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Pulls your repository onto the runner.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin   # Eclipse Temurin — matches your Dockerfile/pom.
          java-version: '17'      # Your pom.xml sets <java.version>17</java.version>.
          cache: maven            # Cache ~/.m2 so later builds skip re-downloading deps.

      - name: Make Maven wrapper executable
        run: chmod +x mvnw        # Git may not preserve the +x bit on ./mvnw.

      - name: Build & test (with coverage)
        # -B = batch/non-interactive, -ntp = no transfer progress spam.
        # `verify` compiles, runs unit tests, and produces the JaCoCo coverage report.
        run: ./mvnw -B -ntp clean verify

      - name: Publish test results
        if: always()              # Run even if the previous step failed, so you see WHY.
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/**   # JUnit XML from the test run.
          if-no-files-found: ignore

      - name: Upload built jar
        if: success()             # Only if the build passed.
        uses: actions/upload-artifact@v4
        with:
          name: app-wat-jar
          path: target/app-wat.jar           # <finalName>app-wat</finalName> in pom.xml.

  # ===================================================================
  # JOB 2 — build the Docker image and push it to GHCR
  # Only runs on push to master (not on pull requests), and only after
  # the tests pass.
  # ===================================================================
  docker:
    needs: build-and-test                              # Wait for Job 1 to succeed.
    if: github.event_name == 'push'                    # Skip on pull requests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0             # Fetch full history + all tags so we can read existing vN tags.

      - name: Compute next version (vN -> vN+1)
        id: version
        run: |
          # List tags that look exactly like v<number> (v1, v2, ...), strip the
          # leading 'v', sort numerically, and take the highest. No tags yet -> 0.
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1)
          latest=${latest:-0}
          next=$((latest + 1))       # The new version number.
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"   # Expose as steps.version.outputs.tag
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"  # 7-char commit id
          echo "Previous: v${latest}  ->  New: v${next}"

      - name: Create and push the git tag
        run: |
          # Tag this commit so the version lives in git history too, and so the
          # NEXT run sees it and increments past it.
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Repo secret you add (your Docker Hub login).
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # Repo secret: a Docker Hub ACCESS TOKEN (not your password).

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .                                   # Use the repo's multi-stage Dockerfile.
          push: true
          # Publish THREE tags of the same image: the new version, the short
          # commit id (precise traceability), and `latest`.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha                         # Reuse Docker layer cache between runs.
          cache-to: type=gha,mode=max                  # Save the layer cache for next time.

  # ===================================================================
  # JOB 3 — publish the Maven artifacts (jar + pom) to Nexus
  # Runs on push to master after tests pass. A CLOUD runner can only
  # reach Nexus through a PUBLIC address, so the host comes from the
  # NEXUS_HOST secret (NOT the pom's private 192.168 default).
  # The job skips itself automatically if NEXUS_HOST is not set.
  # ===================================================================
  deploy-nexus:
    needs: build-and-test                              # Deploy only if tests passed.
    if: github.event_name == 'push'                    # Skip on pull requests.
    runs-on: ubuntu-latest
    # Map secrets to env: secrets can't be used in `if:` directly, env can.
    env:
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}            # e.g. https://nexus.yourdomain.com
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}    # Nexus deploy user.
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}    # Nexus deploy password/token.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Deploy artifacts to Nexus
        if: env.NEXUS_HOST != ''                        # No NEXUS_HOST secret -> skip quietly.
        # -s settings-ci.xml   -> use the CI settings file (reads NEXUS_* from env).
        # -Dnexus.host=...      -> override the pom's private default with the public URL.
        # -DskipTests           -> tests already ran in build-and-test; don't repeat them.
        # Maven routes by version: 3.0.0 -> app-wat-releases, *-SNAPSHOT -> app-wat-snapshots.
        run: ./mvnw -B -ntp -DskipTests clean deploy -s settings-ci.xml -Dnexus.host="${NEXUS_HOST}"

  # ===================================================================
  # OPTIONAL — deploy to Kubernetes (template; uncomment & add secrets)
  # ===================================================================
